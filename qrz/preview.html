<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N7RB QRZ Preview</title>
<style>
  /* Rough stand-in for QRZ's page chrome. For local testing only; not part of the bio. */
  body { margin:0; background:#e9ecef; font-family:Arial, sans-serif; }
  .bar { background:#1b3d6d; color:#fff; padding:10px 16px; font-weight:bold; }
  .wrap { max-width:1000px; margin:16px auto; display:flex; gap:16px; padding:0 16px; }
  .side { width:220px; flex:none; background:#fff; border:1px solid #ccc; padding:12px; font-size:13px; }
  .side h1 { margin:0; font-size:28px; }
  .main { flex:1; min-width:0; background:#fff; border:1px solid #ccc; }
  .tabs { display:flex; border-bottom:1px solid #ccc; font-size:13px; }
  .tabs span { padding:8px 14px; }
  .tabs .on { background:#fff; border-bottom:3px solid #1b3d6d; font-weight:bold; }
  iframe { width:100%; border:0; display:block; }
  @media (max-width:760px) { .wrap { flex-direction:column; } .side { width:auto; } }
</style>
</head>
<body>
  <div class="bar">QRZ.COM (preview mock)</div>
  <div class="wrap">
    <div class="main">
      <div class="tabs"><span>Detail</span><span class="on">Biography</span><span>Logbook</span></div>
      <div style="padding:16px">
        <iframe id="bio" src="n7rb-qrz-bio.html" title="N7RB biography" style="height:2200px"></iframe>
      </div>
    </div>
  </div>
  <script>
    // Fit the iframe to its content when served over http (file:// blocks this; the fixed height is the fallback).
    const f = document.getElementById('bio');
    f.addEventListener('load', () => {
      try {
        f.style.height = '0px';
        f.style.height = (f.contentDocument.body.scrollHeight + 24) + 'px';
      } catch (e) { f.style.height = '2200px'; }
    });
  </script>
</body>
</html>
